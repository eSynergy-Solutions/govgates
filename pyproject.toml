[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govgates-accelerator"
dynamic = ["version"]
description = "Governance gate accelerator for Databricks Unity Catalog"
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
requires-python = ">=3.11"
dependencies = [
  "faker>=25",
  "pyyaml>=6",
  "rapidfuzz>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pandas>=2", "build>=1.2"]
workspace = ["databricks-sdk>=0.30", "databricks-sql-connector>=3", "mlflow>=2.14"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gates*", "synthetic*"]  # src/jobs are job entry points run from bundle files, not part of the package

[tool.setuptools.package-data]
synthetic = ["*.yaml"]
"gates.hydration" = ["abbreviations.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
