  - {term_id: region_code, name: Region Code, domain: Reference, sensitivity: internal, synonyms: [region, rgn, operating region], definition: Operating region the record belongs to (e.g. UK, US, AU).}
  - {term_id: country_code, name: Country Code, domain: Reference, sensitivity: public, synonyms: [country, iso country], definition: ISO 3166 country code.}
  - {term_id: record_created_timestamp, name: Record Created Timestamp, domain: Operational, sensitivity: internal, synonyms: [created at, create ts, rec crt ts], definition: Timestamp the record was created in the source system.}
