# Column-name abbreviation dictionary used before fuzzy matching (specs/hydration.md step 3).
#
# Written from general insurance and data-naming conventions, NOT from the synthetic table specs or the
# golden set, so the eval measures the matcher rather than this file.
#
# Rules:
#   - Keys are single lower-case tokens as produced by the tokenizer (snake_case, camelCase and digits
#     are split, so "PolRefNo" -> pol, ref, no).
#   - Values are plain lower-case words: a string, or a list when the token has several readings.
#   - A list makes the token ambiguous: the matcher scores every reading and keeps the best, but a column
#     containing an ambiguous token never auto-accepts on fuzzy. It goes to the LLM with all readings
#     shown in expanded_name, e.g. "policy (expiry/exposure/expense) date".
#   - Very ambiguous tokens are left out entirely (listed at the bottom).
#   - The matcher scores both the raw and the expanded name, so an expansion can only add matches.
version: 1
abbreviations:
  # --- identifiers and numbering ---
  id: identifier
  ident: identifier
  ref: reference
  refno: reference number
  no: number
  num: number
  nbr: number
  nr: number
  cd: code
  ver: version
  vsn: version
  seq: sequence

