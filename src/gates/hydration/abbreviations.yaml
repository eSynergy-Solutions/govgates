# Deliberately NOT expanded (ambiguous in insurance data):
#   pc   postcode | percent | personal computer
#   tp   third party | type
#   acc  account | accident
#   inc  incurred | income | incident | incorporated
#   res  reserve | result | residential
#   rec  recovery | record | received
#   cat  catastrophe | category
#   reg  registration | region | regulatory
#   st   street | state | status
#   cty  city | county
#   ins  insurer | insured | insurance
#   dl   driving licence | download
#   nat  nationality | natural

ignore_tokens:
  currencies: [gbp, aud, usd, eur]
  strip_trailing_digits: true

# A column whose every token is one of these (or a bare number) is NO_MATCH in code, before fuzzy and the LLM,
# unless a value pattern covers >= 80% of its values. Split on _, case changes and digits.
noise_tokens: [tmp, temp, test, unused, col, field, filler, legacy, ref, user, def, udf, misc, attr, x]
# Noise only next to another noise word: a name made only of these (ref, user, user_ref, ref_1) is not noise.
weak_noise_tokens: [ref, user]
